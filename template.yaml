AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DevOps Multiplication Demo – Deploys a simple static web app on Apache via EC2.
  Demonstrates Infrastructure as Code for my Level 5 DevOps module.

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type (free-tier friendly)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Automatically retrieves the latest Amazon Linux AMI for the region

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp                                 # Allow SSH (optional) for admin access
          FromPort: 22                                    #   In production: I would restrict to a specific IP or remove entirely.
          ToPort: 22
          CidrIp: 0.0.0.0/0
          
      Tags:
        - Key: Name
          Value: DevOpsSecurityGroup

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      Tags:
        - Key: Name
          Value: DevOpsWebServer

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd wget
          systemctl enable httpd
          systemctl start httpd

          cd /var/www/html
          wget https://raw.githubusercontent.com/pjmc86/DevOpsMultiplication/main/MultiplicationApp.html -O index.html
          echo "<h3>Deployed automatically via CloudFormation - $(date)</h3>" >> index.html

Outputs:
  WebsiteURL:
    Description: URL of the deployed application
    Value: !Sub "http://${WebServer.PublicDnsName}/"


